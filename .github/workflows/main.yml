name: Level-2-Python-CI

on: [push]

jobs:
  python-test-job:
    runs-on: ubuntu-latest

    steps:
      # 第 1 步：把你倉庫裡的程式碼（包含 test_app.py）下載到這台雲端電腦
      - name: 1. 下載倉庫程式碼
        uses: actions/checkout@v4

      # 第 2 步：在雲端電腦安裝 Python 3.11
      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 第 3 步：安裝 pytest 測試工具，並自動檢查你的程式碼！
      - name: 3. 安裝 pytest 並執行自動測試
        run: |
          pip install pytest
          pytest test_app.py
