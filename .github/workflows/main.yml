name: Level-3-Secrets-And-Artifacts

on: [push]

jobs:
  build-and-package:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 下載倉庫程式碼
        uses: actions/checkout@v4

      - name: 2. 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 執行測試並讀取機密密碼產生報告
        env:
          # 從 GitHub 保險箱把密碼安全取出來，放進環境變數
          SECRET_CODE: ${{ secrets.MY_SECRET_KEY }}
        run: |
          pip install pytest
          pytest test_app.py
          echo "嘗試在終端機偷印密碼：$SECRET_CODE"
          echo "✅ Python 自動化測試 100% 通過！" > report.txt
          echo "本次建置時間：$(date)" >> report.txt

      # 第 4 步：在雲端電腦銷毀前，把 report.txt 打包上傳！
      - name: 4. 打包並上傳測試報告 (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: my-test-report
          path: report.txt
